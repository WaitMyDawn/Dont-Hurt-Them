plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

ext.platformLoader = 'forge'
apply from: '../../gradle/platform.gradle'
apply from: '../../gradle/fml-common.gradle'

repositories { mavenCentral() }
jarJar.enable()
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${loader_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    jarJar('io.github.llamalad7:mixinextras-forge:0.4.1') {
        jarJar.ranged(it, '[0.4.1,0.5)')
    }
}
mixin {
    add sourceSets.main, 'dont_hurt_them.refmap.json'
    config 'dont_hurt_them.mixins.json'
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory file("run/${name}")
            mods { create(mod_id) { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            mods { "${mod_id}" { source sourceSets.gameTest } }
        }
    }
}

tasks.named('jar') {
    archiveClassifier = 'slim'
    manifest.attributes('MixinConfigs': 'dont_hurt_them.mixins.json')
    finalizedBy 'reobfJar'
}
tasks.named('jarJar') {
    archiveClassifier = ''
    from file('../../LICENSE.md')
    manifest.attributes('MixinConfigs': 'dont_hurt_them.mixins.json')
    finalizedBy 'reobfJarJar'
}
