pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.spongepowered.mixin') useModule('org.spongepowered:mixingradle:0.7.38')
        }
    }
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}
rootProject.name = 'dont-hurt-them-forge-1.20.1'
include ':common'
project(':common').projectDir = file('../../common')
